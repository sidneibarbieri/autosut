[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autosut"
version = "0.1.0"
description = "AutoSUT: System Under Test measurement for ATT&CK-driven adversary emulation"
authors = [
    {name = "AutoSUT contributors"}
]
readme = "docs/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
]

dependencies = [
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "click==8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "flake8==7.3.0",
    "mypy==2.3.1",
]

[project.scripts]
autosut-run = "runners.campaign_runner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "runners*",
    "executors*",
    "loaders*",
    "models*",
    "calibration*",
    "cti*",
    "infrastructure*",
    "utils*",
    "planning*",
    "evaluation*",
]

[tool.setuptools.package-data]
autosut = ["**/*.yml", "**/*.yaml", "**/*.json", "**/*.md"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = ["windows_media: real FAT/ISO validation requiring native media tools, not VM execution"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
